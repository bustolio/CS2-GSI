# JitPack build configuration — https://jitpack.io/docs/BUILDING/
# Build with JDK 17 (the project targets maven.compiler.release=17).
jdk:
  - openjdk17

# Only build and publish the core library module (cs2gsi). This skips the
# example (fat-jar) module, which is not meant to be consumed as a dependency
# and would slow down / risk the JitPack build.
#
# Use the Maven wrapper (./mvnw) so the build runs on a modern Maven (3.9.9).
# JitPack's system Maven is too old (~3.2.5) for the plugin versions this
# project pins (surefire 3.5.3, javadoc 3.11.2, checkstyle 3.6.0 all require
# Maven >= 3.6.3).
install:
  - ./mvnw install -DskipTests -B -pl lib -am
